<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crown Code — Open-Source AI for Coding</title>
<meta name="description" content="Crown Code is a free, open-source AI assistant built only for writing and fixing code. By Devvadarsh, Crown Lab.">
<style>
:root{--bg:#090b14;--side:#0d1020;--card:#14182a;--tx:#f3f4ff;--mu:#969bb8;--bd:#252a43;--ac:#7957ff;--ach:#6843f0;--us:#242044;--cb:#090c17;--cbh:#171c30;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(ellipse at 75% -20%,#25204a 0,transparent 42%),var(--bg);color:var(--tx);display:flex;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
#side{width:272px;background:linear-gradient(180deg,#11142a 0%,#0d1020 70%,#171039 100%);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:18px 12px;transition:transform .25s;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px;padding:4px 9px 22px;letter-spacing:-.4px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#9b65ff,#5526dc);color:#fff;display:grid;place-items:center;font-size:17px;box-shadow:0 5px 18px #6e43ff55}
#newbtn{display:flex;align-items:center;gap:8px;width:100%;padding:11px 13px;border:1px solid #805eff;background:linear-gradient(110deg,#8057ff,#5b31e9);border-radius:12px;font-weight:650;box-shadow:0 8px 24px #6c43ff35}
#newbtn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.lbl{font-size:11px;color:#858baa;padding:22px 10px 8px;letter-spacing:.1em;font-weight:700}
#list{flex:1;overflow:auto}
.it{display:flex;align-items:center;gap:6px;padding:10px 11px;border:1px solid transparent;border-radius:11px;cursor:pointer;font-size:14px;color:#d6d8ed;margin:3px 0}
.it span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.it:hover,.it.on{background:#242044;border-color:#3a3268}
.it.on{box-shadow:inset 3px 0 #986bff}
.it .x{opacity:0;border:0;background:none;color:var(--mu);padding:0 4px}.it:hover .x{opacity:1}
.sf{border-top:1px solid var(--bd);padding-top:12px;font-size:12px;color:var(--mu)}
.sf a{color:#aeb2cf;display:block;padding:5px 8px;text-decoration:none}.sf a:hover{color:#b69aff}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:13px 22px;border-bottom:1px solid #252a435e;background:#0c0e19aa;backdrop-filter:blur(16px)}
#top h1{font-size:15px;margin:0;font-weight:650;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ib{border:1px solid var(--bd);background:#171b2d;border-radius:9px;padding:6px 11px;font-size:13px}.ib:hover{border-color:#7957ff}
#menu{display:none}
#chat{flex:1;overflow:auto;padding:30px 22px 12px;scroll-behavior:smooth}
.w{max-width:850px;margin:0 auto}
.msg{margin:0 0 24px}
.u{display:flex;justify-content:flex-end}
.u .b{background:linear-gradient(135deg,#30275c,#252044);border:1px solid #51427f;padding:11px 16px;border-radius:17px 17px 5px 17px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.a{display:flex;gap:12px}.a .av{width:32px;height:32px;flex:none;border-radius:10px;background:linear-gradient(135deg,#9b65ff,#5526dc);color:#fff;display:grid;place-items:center;font-size:15px;margin-top:2px;box-shadow:0 5px 16px #6e43ff35}
.a .b{min-width:0;flex:1;padding-top:2px}
.b p{margin:0 0 12px}.b ul,.b ol{margin:0 0 12px;padding-left:22px}.b h3,.b h4,.b h2{margin:16px 0 8px}
.b code.i{background:#242943;padding:2px 6px;border-radius:5px;font:13px ui-monospace,Menlo,Consolas,monospace;color:#d7c9ff}
.b a{color:#b69aff}
.cb{background:var(--cb);border-radius:12px;margin:0 0 14px;overflow:hidden;border:1px solid #303650}
.ch{display:flex;justify-content:space-between;align-items:center;background:var(--cbh);color:#aeb4d0;font-size:12px;padding:8px 13px}
.ch button{background:#252b43;border:1px solid #343b59;border-radius:7px;padding:3px 9px;color:#c6c9dc;font-size:12px}.ch button:hover{color:#fff;border-color:#7957ff}
.cb pre{margin:0;padding:15px;overflow:auto}
.cb code{color:#e6e8f5;font:13px/1.65 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:#a58aff;animation:d 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes d{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
.err{color:#ffb8c0;background:linear-gradient(110deg,#351a2a,#251923);border:1px solid #9d405d;padding:14px 16px;border-radius:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.err .error-copy{flex:1;min-width:180px}.err strong{display:block;color:#ff7186;margin-bottom:2px}.err small{color:#e4b8c2}
.err button{border:1px solid #a94d69;background:#54263a;color:#ffe6ec;border-radius:9px;padding:7px 12px;font-size:13px}.err button:hover{background:#71334b}
#empty{text-align:center;padding:10vh 0 0}
#empty .logo{width:58px;height:58px;font-size:27px;border-radius:17px;margin:0 auto 16px}
#empty h2{font-size:30px;margin:0 0 6px;font-weight:750;letter-spacing:-.8px}
#empty p{color:var(--mu);margin:0 0 27px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:11px;max-width:650px;margin:0 auto}
.chip{background:linear-gradient(145deg,#171b30,#121628);border:1px solid #2b3150;border-radius:13px;padding:13px 15px;text-align:left;font-size:13px;color:#d6d8ed;transition:.18s}.chip:hover{border-color:#7957ff;transform:translateY(-2px);background:#1e1a3b}
#bar{padding:10px 22px calc(17px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,#0b0d18 35%)}
.box{max-width:850px;margin:0 auto;background:#171b2e;border:1px solid #343958;border-radius:17px;padding:10px 10px 10px 17px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 10px 35px #0003}
.box:focus-within{border-color:#8868ff;box-shadow:0 0 0 3px #7957ff20,0 10px 35px #0003}
textarea{flex:1;border:0;outline:0;background:none;color:var(--tx);font:inherit;resize:none;max-height:200px;padding:6px 0}
textarea::placeholder{color:#858baa}
#send{width:38px;height:38px;border-radius:11px;border:0;background:linear-gradient(135deg,#9668ff,#6235ec);color:#fff;font-size:17px;box-shadow:0 5px 16px #6e43ff45}
#send:hover{filter:brightness(1.12)}#send:disabled{opacity:.4;cursor:default}
.fine{text-align:center;font-size:11px;color:#858baa;margin-top:10px}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);max-width:480px;width:calc(100% - 32px);padding:22px}
dialog::backdrop{background:#0009}
dialog h3{margin:0 0 6px}dialog input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:8px 0}
dialog ol{padding-left:20px;line-height:1.8;font-size:14px}dialog a{color:#b69aff}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.pb{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 16px}
@media(max-width:760px){#side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);width:min(290px,85vw)}#side.open{transform:none;box-shadow:0 0 40px #0009}#menu{display:inline-block}.chips{grid-template-columns:1fr}#chat{padding:22px 14px 8px}#bar{padding-left:13px;padding-right:13px}#empty{padding-top:7vh}#empty h2{font-size:25px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head><body>
<aside id="side">
 <div class="brand"><div class="logo">♛</div>Crown Code</div>
 <button id="newbtn">＋ New chat</button>
 <div class="lbl">RECENT CHATS</div><div id="list"></div>
 <div class="sf"><a href="https://github.com/devvadarsh/crowncode" target="_blank" rel="noopener">⭐ Open source · MIT</a><a href="https://devvadarsh.github.io/crownlab" target="_blank" rel="noopener">By Devvadarsh · Crown Lab</a></div>
</aside>
<div id="main">
 <div id="top"><button class="ib" id="menu">☰</button><h1 id="title">New chat</h1></div>
 <div id="chat"><div class="w" id="msgs"></div></div>
 <div id="bar"><div class="box"><textarea id="in" rows="1" placeholder="Ask a coding question…"></textarea><button id="send" title="Send">➤</button></div>
 <div class="fine">Crown Code answers coding questions only. Free to use. Chats are saved only in this browser. AI can make mistakes — test the code.</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let chats=[];try{chats=JSON.parse(localStorage.getItem('cc_chats')||'[]')}catch(e){}
let cur=null,busy=false,lastFailedPrompt='';
const save=()=>{try{localStorage.setItem('cc_chats',JSON.stringify(chats))}catch(e){}};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inl(s){return esc(s).replace(/`([^`\n]+)`/g,'<code class="i">$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function txt(t){let o='',L=t.split('\n'),i=0;while(i<L.length){let l=L[i];if(/^\s*([-*]|\d+\.)\s/.test(l)){const ord=/^\s*\d+\./.test(l),tag=ord?'ol':'ul';o+=`<${tag}>`;while(i<L.length&&/^\s*([-*]|\d+\.)\s/.test(L[i])){o+='<li>'+inl(L[i].replace(/^\s*([-*]|\d+\.)\s/,''))+'</li>';i++}o+=`</${tag}>`;continue}
const h=l.match(/^(#{1,4})\s+(.*)/);if(h){o+=`<h3>${inl(h[2])}</h3>`}else if(l.trim()){let p=[l];while(i+1<L.length&&L[i+1].trim()&&!/^\s*([-*]|\d+\.)\s|^#{1,4}\s/.test(L[i+1]))p.push(L[++i]);o+='<p>'+p.map(inl).join('<br>')+'</p>'}i++}return o}
function md(t){return t.split('```').map((p,i)=>{if(i%2){const n=p.indexOf('\n');const lang=n<0?'code':(p.slice(0,n).trim()||'code'),code=n<0?'':p.slice(n+1).replace(/\n$/,'');return `<div class="cb"><div class="ch"><span>${esc(lang)}</span><button onclick="cp(this)">Copy</button></div><pre><code>${esc(code)}</code></pre></div>`}return txt(p)}).join('')}
function cp(b){navigator.clipboard.writeText(b.parentElement.nextElementSibling.innerText).then(()=>{b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy',1500)})}
function getChat(){return chats.find(c=>c.id===cur)}
function renderList(){const l=$('list');l.innerHTML='';chats.slice().sort((a,b)=>b.t-a.t).forEach(c=>{const d=document.createElement('div');d.className='it'+(c.id===cur?' on':'');d.innerHTML=`<span>${esc(c.title)}</span><button class="x" title="Delete">✕</button>`;d.onclick=e=>{if(e.target.className==='x'){if(confirm('Delete this chat?')){chats=chats.filter(x=>x.id!==c.id);save();if(cur===c.id)newChat();else renderList()}return}open(c.id);$('side').classList.remove('open')};l.appendChild(d)})}
function row(role,t){const m=document.createElement('div');m.className='msg '+(role==='user'?'u':'a');m.innerHTML=role==='user'?`<div class="b">${esc(t)}</div>`:`<div class="av">♛</div><div class="b">${md(t)}</div>`;$('msgs').appendChild(m);return m.querySelector('.b')}
function scroll(){const c=$('chat');c.scrollTop=c.scrollHeight}
function showEmpty(){$('msgs').innerHTML=`<div id="empty"><div class="logo">♛</div><h2>What are we building today?</h2><p>Crown Code writes, explains and fixes code. Free and open source.</p><div class="chips"><button class="chip">Write a debounce function in JavaScript</button><button class="chip">Explain async/await with a simple example</button><button class="chip">Create a REST API with Node.js and Express</button><button class="chip">Why does my React useEffect run twice?</button></div></div>`;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('in').value=b.textContent;send()})}
function open(id){cur=id;const c=getChat();$('title').textContent=c?c.title:'New chat';$('msgs').innerHTML='';if(!c||!c.msgs.length)showEmpty();else c.msgs.forEach(m=>row(m.role,m.text));renderList();scroll()}
function newChat(){cur=null;$('title').textContent='New chat';showEmpty();renderList();$('in').focus()}
async function send(){if(busy)return;const q=$('in').value.trim();if(!q)return;
let c=getChat();if(!c){c={id:Date.now()+'',title:q.slice(0,42),t:Date.now(),msgs:[]};chats.push(c);cur=c.id;$('msgs').innerHTML='';$('title').textContent=c.title}
c.msgs.push({role:'user',text:q});c.t=Date.now();save();renderList();row('user',q);$('in').value='';$('in').style.height='auto';
const out=row('model','');out.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';scroll();busy=true;$('send').disabled=true;let full='';
try{const contents=c.msgs.slice(-24).map(m=>({role:m.role,parts:[{text:m.text}]}));
const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents})});
if(!r.ok){let j={};try{j=await r.json()}catch(e){}const err=new Error((typeof j.error==='string'?j.error:j.error&&j.error.message)||('The server returned an error.'));err.status=r.status;throw err}
const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
while(true){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});let ls=buf.split('\n');buf=ls.pop();for(const l of ls){if(!l.startsWith('data:'))continue;try{const j=JSON.parse(l.slice(5));const p=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;if(p){full+=p.map(x=>x.text||'').join('');out.innerHTML=md(full);scroll()}}catch(e){}}}
if(!full)full='I could not generate a reply. Please try again.';out.innerHTML=md(full);c.msgs.push({role:'model',text:full});save()}
catch(e){
lastFailedPrompt=q;
const status=e.status||0;
let detail=e.message||'Something went wrong while processing your request.';
if(status===405) detail='The chat API route was not found. Deploy this file as functions/api/chat.js in your Cloudflare Pages project, then redeploy.';
out.innerHTML=`<div class="err"><div class="error-copy"><strong>Error${status?' '+status:''}</strong><small>${esc(detail)}</small></div><button type="button" onclick="retryLast()">↻ Try again</button></div>`;
if(full){c.msgs.push({role:'model',text:full});save()}else{c.msgs.pop();save()}
}
busy=false;$('send').disabled=false;scroll()}
window.retryLast=()=>{const input=$('in');if(!input.value.trim()&&lastFailedPrompt)input.value=lastFailedPrompt;send()};
$('send').onclick=send;$('newbtn').onclick=()=>{newChat();$('side').classList.remove('open')};
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,200)+'px'});
$('menu').onclick=()=>$('side').classList.toggle('open');
newChat();
</script></body></html>
